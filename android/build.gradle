// 1. 【删除】group 和 version 声明
// Flutter 插件的版本由根目录的 pubspec.yaml 统一管理

// 2. 【使用】声明式插件语法 (替代旧的 apply plugin)
plugins {
    id "com.android.library"
    id "org.jetbrains.kotlin.android"
}

// 3. 【配置】Android 构建参数
android {
    namespace "me.yohom.amap_search_fluttify"
    compileSdk 34

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        main.jniLibs.srcDir "libs"
    }

    defaultConfig {
        minSdk 21
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    lint {
        disable "InvalidPackage"
    }

    packaging {
        resources {
            // 修正 merges 语法（Gradle 8.0+ 推荐使用 from）
            merges += [
                "res/values/values.xml", 
                "AndroidManifest.xml", 
                "R.txt", 
                "classes.jar", 
                "proguard.txt"
            ]
        }
    }

    buildTypes {
        release {
            consumerProguardFiles "proguard-rules.pro"
        }
    }
}

// 4. 【依赖】
dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar", "*.aar"])
    implementation "androidx.annotation:annotation:1.7.0"
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.0"
    compileOnly project(path: ":foundation_fluttify", configuration: "default")
    api "com.amap.api:search:9.2.0"
}